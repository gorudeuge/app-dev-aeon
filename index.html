<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--bg:#fdf3f8;--sf:#fff;--tx:#241a21;--mu:#6e6068;--ac:#b5006b;--ac2:#fbe3ef;--ln:#efd6e4;--ok:#1d7a4d;--wn:#b36b00;--er:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171216;--sf:#221b21;--tx:#f3eaf0;--mu:#b3a3ac;--ac:#ff6db3;--ac2:#3a1b2c;--ln:#3a2f38;--ok:#5fd39b;--wn:#f0b252;--er:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171216;--sf:#221b21;--tx:#f3eaf0;--mu:#b3a3ac;--ac:#ff6db3;--ac2:#3a1b2c;--ln:#3a2f38;--ok:#5fd39b;--wn:#f0b252;--er:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(circle at 100% 0,rgba(181,0,107,.12),transparent 42%),radial-gradient(circle at 0 100%,rgba(181,0,107,.09),transparent 46%),var(--bg);background-attachment:fixed;color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
header{background:linear-gradient(120deg,#8a0052,#c4007a 65%,#e2479f);color:#fff;padding:16px max(20px,env(safe-area-inset-right,0px)) 16px max(20px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(138,0,82,.25)}
header h1{font-size:1.3rem;line-height:1.15;margin:0;flex:1;font-weight:700;letter-spacing:.2px}

header span{font-size:.9rem;opacity:.95}
header button{background:#fff;color:#8a0052;border-color:#fff}
main{max-width:980px;margin:0 auto;padding:20px max(20px,env(safe-area-inset-right,0px)) 20px max(20px,env(safe-area-inset-left,0px))}
h2{font-size:1.25rem;margin:0 0 12px}
.card{background:var(--sf);border:1px solid var(--ln);border-top:3px solid var(--ac);border-radius:16px;box-shadow:0 2px 12px rgba(181,0,107,.08);padding:16px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--mu);margin:10px 0 4px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--ln);border-radius:6px;background:var(--bg)}
:is(input,select,textarea,button):focus-visible{outline:3px solid var(--ac);outline-offset:1px}
button{cursor:pointer;border:1px solid var(--ac);background:var(--ac);color:#fff;padding:8px 14px;border-radius:99px;font-weight:600;touch-action:manipulation}
button:disabled{opacity:.55;cursor:progress}
button.ghost{background:transparent;color:var(--ac)}
button,input,select{min-height:44px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 180px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--sf);border:1px solid var(--ln);border-left:5px solid var(--ac);border-radius:14px;box-shadow:0 2px 8px rgba(181,0,107,.07);padding:10px 14px}
.stat b{font-size:1.7rem;display:block;line-height:1.1}.stat small{color:var(--mu)}
.tk{border-top:1px solid var(--ln);padding:12px 0}.tk:first-child{border-top:0}
.tk h3{margin:0;font-size:1rem}.meta{color:var(--mu);font-size:.85rem}
.pill{display:inline-block;font-size:.78rem;font-weight:600;border-radius:99px;padding:2px 10px;border:1px solid currentColor;margin-right:6px}
.Open{color:var(--er)}.In-progress{color:var(--wn)}.Resolved{color:var(--ok)}.Urgent{color:var(--er)}.High{color:var(--wn)}.Normal,.Low{color:var(--mu)}
.log{font-size:.82rem;color:var(--mu);margin:6px 0 0;padding-left:16px}
.err{color:var(--er);font-size:.9rem;min-height:1.2em}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tabs button.on{background:var(--ac);color:#fff}.tabs button:not(.on){background:transparent;color:var(--ac)}
.empty{color:var(--mu);padding:12px 0}
.bar{height:10px;background:var(--ln);border-radius:5px;margin:6px 0}.bar i{display:block;height:10px;border-radius:5px}
nav{display:flex;gap:8px;padding:10px 20px;background:var(--sf);border-bottom:1px solid var(--ln);overflow-x:auto}nav:empty{display:none}
nav button{background:transparent;color:var(--ac);white-space:nowrap}nav button.on{background:var(--ac);color:#fff}nav button span{margin-right:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:50;max-width:min(420px,calc(100vw - 32px));background:var(--er);color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.3);font-size:.9rem}
#botb{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;width:56px;height:56px;padding:0;border-radius:50%;font-size:1.5rem;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#botp{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;width:min(360px,calc(100vw - 32px));height:min(480px,calc(100vh - 170px));display:none;flex-direction:column;background:var(--sf);border:1px solid var(--ln);border-top:3px solid var(--ac);border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.25);overflow:hidden}
#botp.open{display:flex}
#botm{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bm{max-width:88%;padding:8px 12px;border-radius:14px;white-space:pre-wrap;font-size:.92rem}
.bm.b{background:var(--ac2);align-self:flex-start}.bm.u{background:var(--ac);color:#fff;align-self:flex-end}
#botc{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}#botc button{font-size:.8rem;padding:4px 10px;min-height:32px}
#botf{display:flex;gap:8px;padding:10px;border-top:1px solid var(--ln)}#botf input{flex:1}
@media (prefers-color-scheme:dark){button:not(.ghost),nav button.on,.tabs button.on,.bm.u{color:#2b0a1c}header button{color:#8a0052}}
@media (min-width:900px){main{max-width:1140px}.tkgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tkgrid .tk,.tkgrid .tk:first-child{border:1px solid var(--ln);border-radius:8px;padding:12px 14px}.tkgrid .empty{grid-column:1/-1}.stats{grid-template-columns:repeat(4,1fr)}button:not(:disabled):hover{filter:brightness(1.08)}}
@media (max-width:700px){nav{position:fixed;left:0;right:0;bottom:0;z-index:20;justify-content:space-around;gap:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln);border-bottom:0;box-shadow:0 -4px 16px rgba(0,0,0,.1)}nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;padding:6px 2px;border:0;border-radius:12px;min-height:54px}nav button span{font-size:1.3rem;margin:0}body{padding-bottom:84px}#botb{bottom:calc(78px + env(safe-area-inset-bottom,0px))}#botp{bottom:calc(144px + env(safe-area-inset-bottom,0px));height:min(480px,calc(100vh - 240px))}#toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}}
@media (max-width:600px){main{padding-top:14px;padding-bottom:14px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}header{padding-top:10px;padding-bottom:10px}.stats{grid-template-columns:1fr 1fr}.tabs button{flex:1 1 auto}.row>*{flex:1 1 100%}.card{padding:12px}#out{margin-left:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* 1. Paste your Supabase project values here (Project Settings > API). The anon key is safe to expose; row-level security protects the data. */
const SUPABASE_URL="https://qxmzzrjjwpfxsjqepwav.supabase.co",SUPABASE_KEY="sb_publishable_TAtHPyAtTwHleVs-Qap49Q_0B_boarK";
</script>
<script>
const $=i=>document.getElementById(i),nav=$("nav"),app=$("app");
const FL=[["G","Ground floor"],["1F","1st floor"],["2F","2nd floor"],["3F","3rd floor"]],CL={F:"Food & beverage",S:"Shop",V:"Service"};
/* Tenant list: AEON Mall BSD City opening directory (AEON press release, April 2015). May be out of date. */
const DIR={G:{F:"Auntie Anne's,Beard Papa,Bread Life,Caffe Bene,Chikugo Udon,Del'Immo,EDOSAWA,Famous Amos & DG Chocolate Gallery,Fuji Restaurant,Golden Century,Gyukaku,Hakata Ichibandori,HKC & Maison Tatsuya,Iceworld,Ichibankan,Java Jazz Coffee,Kaihomaru,Kin No Torikara,KKULDAK,Kushiya Monogatari,Liberica Coffee,Little Tokyo Bar,Little Tokyo Bakery,Mama Malaka,Manhattan Fish Market,Matsuyama,Mochi Sweets,Ocaraka,O-GI,Ootoya,Organic Luwak Coffee House,Pappa Jack,Piza Doki,Popolamama,Sagami Food,Sakura Juice Bar,Shihlin,Starbucks Coffee,Taste Better,Tokugawa,Tetsunabe Gyoza,Tokyo Walking,Uchino Shokudo,Yamakawaya,Yamatoya",S:"AEON BSD City Store,Beaute Recipe,Beauty Box,Billabong,C&F,Century,Daniel Wellington,Guardian,Infinite,Luminaire,Motobaiku,Nike,Optik Melawai,Optik Seis,Pesona Jewelry,Planet Sports,Point Break World,Quiksilver,United Bike,Watch Engine,Watch World,Yves Rocher",V:"Aeon Credit Service,BNI,CIMB Niaga,De Wasz,Fujifilm XPose Photo,Midas Xchange,Stop n Go"},"1F":{F:"Koi Cafe",S:"(X)SML,Baleno,Batik Keris,Camel Active,Charles & Keith,Clarks,Cleopatra,Donini,Everbest,Folli Follie,Giordano,Guess Accessories,H&M,Hush Puppies,Levi's,Metaphor,Pedro,Polo Ralph Lauren,Samuel & Kevin,The Watch Co.,UNIQLO,Universal Traveller,Watch World",V:"Ginza Nail"},"2F":{F:"Bakmi GM,Sate Khas Senayan",S:"Advance Inspiration,ANAP,Bata,Bateeq,Cindy,Clodi Addict,Coconut Island,Craftholic,Daiso Japan,Eprise,Gramedia,JYSK,Mannequin,Minimal,Multi Toys N Game,Opelon,Osella,Scoop,Snoopy Baby & Curly,Stroberi,Toys City,Travel Xperience,Urban & Co,Valino,Warna,World of Craft,Yawaragi,Yayang",V:"Global Art,Kimi Nail Spa,Kumon,Miniapolis,Nuansa Musik,Shichida,Shortcut Barbershop"},"3F":{F:"Solaria,Begor Pondok Suryo,Kenny Rogers Roasters,Hong Tang,I Love Taimei,Imperial Kitchen,Tawan,Yong Tau Fu,Steak 21,Sukiya,Jinpin The Artistic Tea,Ebisoba Ichigen,Hakata Men-oh,Nagi Ramen,Seirokuya Ramen,Ramen Kanbe,Kazan Ramen,Tabushi Ramen,Hop Hop",S:"Ace Hardware,Best Denki,Erafone,Samsung,Smile,GaleriGadget.com,Loly Poly,Telesindo Shop,Wellcomm,Play,Oke Shop,Ogawa,Cana,Studio Tas,iConnect",V:"Amazone,Cinema XXI,Apple Kids Club,JTB,HIS,Dwidaya Tour,Tokio Marine,Celebrity Fitness"}};
const STORES=[];for(const f in DIR)for(const c in DIR[f])DIR[f][c].split(",").forEach(n=>STORES.push({id:f+"-"+String(STORES.filter(s=>s.fl===f).length+1).padStart(2,"0"),name:n,fl:f,cat:CL[c]}));
const flName=f=>FL.find(x=>x[0]===f)[1];
const ZONES=[{k:"A",n:"Parking annex (roofed)",cap:1600},{k:"B",n:"Outdoor lot",cap:440},{k:"D",n:"Disabled bays",cap:24},{k:"W",n:"Women-driver bays",cap:60}];
const CATS=["Electrical","Plumbing","Air conditioning","Cleaning","Signage","Security","Other"];
const PRI=["Low","Normal","High","Urgent"],STAT=["Open","In progress","Resolved"],TEAMS=["Unassigned","Electrical crew","Plumbing crew","HVAC crew","Housekeeping","Security"];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cls=s=>String(s).replace(/\s+/g,"-");
let db=null,me=null,tab="list",sec="",fq2="",ff="All",filt={status:"All",pri:"All",q:"",sort:"new"};

/* Small UI helpers */
let toastT;
function toast(m){let t=$("toast");if(!t){t=document.createElement("div");t.id="toast";t.setAttribute("role","alert");document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,5000)}
const fail=e=>toast("Something went wrong: "+((e&&e.message)||e));
/* Runs an async action with the button disabled so a double tap cannot send it twice. */
async function go(b,f){if(b.disabled)return;b.disabled=true;try{await f()}catch(e){fail(e)}finally{b.disabled=false}}
const fmt=d=>new Date(d).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"});
const keepFocus=(id,fn)=>{const e=$(id),p=e.selectionStart;fn();const n=$(id);n.focus();n.setSelectionRange(p,p)};

/* Supabase: unchanged */
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const bye=async()=>{await sb.auth.signOut();me=null;db=null;sec="";login()};
async function pull(){
 const [t,ev,z,l]=await Promise.all([sb.from("tickets").select("*").order("id",{ascending:false}),sb.from("ticket_events").select("*").order("created_at"),sb.from("parking_zones").select("*"),sb.from("lost_items").select("*").order("created_at")]);
 for(const r of [t,ev,z,l])if(r.error)throw r.error;
 db={tickets:t.data.map(r=>({id:r.id,uid:r.store_id,unit:r.store_id,cat:r.category,pri:r.priority,title:r.title,desc:r.description,status:r.status,team:r.assigned_team,log:ev.data.filter(e=>e.ticket_id===r.id).map(e=>e.note+" · "+fmt(e.created_at))})),
  park:Object.fromEntries(z.data.map(r=>[r.key,r.occupied])),lost:l.data.map(r=>({id:r.id,kind:r.kind,item:r.item,where:r.location,date:fmt(r.created_at),status:r.status}))}}
async function enter(u){me=u;app.innerHTML='<p class="empty" role="status">Loading…</p>';try{await pull();render()}catch(e){fail(e);if(u.role==="visitor"||!db)login()}}
async function fromSession(){const {data:{session}}=await sb.auth.getSession();if(!session)return false;
 const {data:p,error}=await sb.from("profiles").select("*").eq("id",session.user.id).single();if(error||!p)return false;
 const s=STORES.find(x=>x.id===p.store_id),m=p.role==="manager";
 await enter({id:m?session.user.id:p.store_id,name:m?"Facilities Manager":(s?s.name+" ("+s.id+")":"Store staff"),role:p.role,unit:p.store_id||"Mall Office"});return true}
async function init(){try{if(!(await fromSession()))login()}catch(e){login()}}

/* Shell */
const ICON={tix:"🎫",find:"🔎",park:"🅿️",lost:"🧳"};
function render(){const R=me.role,S=[["tix",R==="manager"?"Tickets":"My tickets"],["find","Store finder"],["park","Parking"],["lost","Lost & found"]].filter(x=>R!=="visitor"||x[0]!=="tix");
 if(!S.some(x=>x[0]===sec))sec=S[0][0];
 nav.innerHTML=S.length<2?"":S.map(x=>`<button class="${x[0]===sec?"on":""}" data-s="${x[0]}" ${x[0]===sec?'aria-current="page"':""}><span aria-hidden="true">${ICON[x[0]]}</span>${x[1]}</button>`).join("");
 nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{sec=b.dataset.s;render();scrollTo(0,0)});
 $("who").textContent=me.name;const o=$("out");o.hidden=false;o.onclick=bye;
 ({tix,find,park,lost})[sec]()}

/* Login */
function login(){nav.innerHTML="";$("who").textContent="";$("out").hidden=true;
 app.innerHTML=`<div class="card" style="max-width:420px;margin:30px auto"><h2>Welcome to AEON Mall BSD City</h2>
 <p class="meta">Store staff and the facilities manager sign in with email and password. Visitors need no account.</p>
 <label for="em">Email</label><input id="em" type="email" autocomplete="username" inputmode="email"><label for="pw">Password (6+ characters)</label><input id="pw" type="password" autocomplete="current-password">
 <p class="err" id="e" role="alert"></p><button id="go">Sign in</button> <button id="gu" class="ghost">Continue as visitor</button>
 <h2 style="margin-top:22px">New store account</h2><p class="meta">Uses the email and password above.</p>
 <label for="st">Your store</label><select id="st">${FL.map(f=>`<optgroup label="${f[1]}">${STORES.filter(s=>s.fl===f[0]).map(s=>`<option value="${s.id}">${esc(s.name)} (${s.id})</option>`).join("")}</optgroup>`).join("")}</select>
 <p><button id="su" class="ghost">Create store account</button></p></div>`;
 const msg=t=>{$("e").textContent=t},cred=()=>({email:$("em").value.trim(),password:$("pw").value});
 const need=()=>{const c=cred();if(!c.email||c.password.length<6){msg("Enter your email and a password of at least 6 characters.");return false}msg("");return true};
 const doIn=()=>need()&&go($("go"),async()=>{const {error}=await sb.auth.signInWithPassword(cred());if(error)return msg("Sign-in failed: "+error.message);if(!(await fromSession()))msg("This account has no profile yet. Ask the facilities manager.")});
 $("go").onclick=doIn;
 $("pw").onkeydown=e=>{if(e.key==="Enter")doIn()};
 $("su").onclick=()=>need()&&go($("su"),async()=>{const {data,error}=await sb.auth.signUp({...cred(),options:{data:{store_id:$("st").value}}});if(error)return msg("Could not create the account: "+error.message);if(!data.session)return msg("Account created. Confirm it from the email we sent, then sign in.");await fromSession()});
 $("gu").onclick=()=>go($("gu"),async()=>{await sb.auth.signOut();await enter({id:"v",name:"Visitor",role:"visitor",unit:"-"})})}

/* Store finder: only the results are redrawn while typing, so the search box keeps focus */
function findList(){const r=STORES.filter(s=>(ff==="All"||s.fl===ff)&&(!fq2||(s.name+s.cat).toLowerCase().includes(fq2.toLowerCase())));
 return r.map(s=>`<div class="tk"><h3>${esc(s.name)}</h3><div class="meta">${flName(s.fl)} · ${s.cat} · Unit ${s.id}</div></div>`).join("")||'<p class="empty">No store matches. Try a shorter name or choose All floors.</p>'}
function find(){
 app.innerHTML=`<div class="card"><h2>Find a store</h2><p class="meta">${STORES.length} tenants from the 2015 opening directory, so some may have changed. Unit codes are placeholders, not official numbers.</p><div class="row"><div><label for="fa">Search</label><input id="fa" type="search" value="${esc(fq2)}" placeholder="Name or category"></div><div><label for="fb">Floor</label><select id="fb"><option value="All">All floors</option>${FL.map(f=>`<option value="${f[0]}" ${f[0]===ff?"selected":""}>${f[1]}</option>`).join("")}</select></div></div></div><div class="card tkgrid" id="fr" aria-live="polite">${findList()}</div>`;
 $("fb").onchange=e=>{ff=e.target.value;$("fr").innerHTML=findList()};
 $("fa").oninput=e=>{fq2=e.target.value;$("fr").innerHTML=findList()}}

/* Parking */
function park(){const m=me.role==="manager";
 app.innerHTML=`<div class="card"><h2>Parking availability</h2><p class="meta">Capacities are approximate, from the 2015 opening release. The manager records vehicles in and out by hand.</p>${ZONES.map(z=>{const u=db.park[z.k]||0,p=Math.min(100,Math.round(u/z.cap*100)),c=p>=95?"var(--er)":p>=80?"var(--wn)":"var(--ok)";return `<div class="tk"><h3>${z.n}</h3><div class="meta">${Math.max(0,z.cap-u)} free of ${z.cap} · ${p}% full</div><div class="bar" role="img" aria-label="${p}% full"><i style="width:${p}%;background:${c}"></i></div>${m?`<button class="ghost" data-z="${z.k}" data-d="-1">Vehicle out</button> <button data-z="${z.k}" data-d="1">Vehicle in</button>`:""}</div>`}).join("")}</div>`;
 app.querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>{if(!m)return;const z=ZONES.find(x=>x.k===b.dataset.z);
  go(b,async()=>{const r=await sb.rpc("adjust_parking",{zone_key:z.k,delta:+b.dataset.d});if(r.error)return fail(r.error);await pull();park()})})}

/* Lost & found */
function lost(){const m=me.role==="manager",ST=["Searching","At Information Counter","Returned"];
 app.innerHTML=`<div class="card"><h2>Lost &amp; found</h2><div class="row"><div><label for="lk">I want to report</label><select id="lk"><option value="Lost">Something I lost</option><option value="Found">Something I found</option></select></div><div><label for="li">Item</label><input id="li" maxlength="80"></div><div><label for="lw">Where, and on which floor?</label><input id="lw" maxlength="80"></div></div><p class="err" id="le" role="alert"></p><button id="ls">Submit report</button><p class="meta">Found items should be handed to the Information Counter.</p></div><div class="card tkgrid">${db.lost.length?db.lost.slice().reverse().map(x=>`<div class="tk"><h3>${esc(x.item)}</h3><div class="meta">${esc(x.kind)} · ${esc(x.where)} · ${esc(x.date)}</div><span class="pill ${x.status==="Returned"?"Resolved":"Open"}">${esc(x.status)}</span>${m?`<select data-l="${x.id}" aria-label="Status of ${esc(x.item)}">${ST.map(s=>`<option ${s===x.status?"selected":""}>${s}</option>`).join("")}</select>`:""}</div>`).join(""):'<p class="empty">No reports yet.</p>'}</div>`;
 $("ls").onclick=()=>{const i=$("li").value.trim(),w=$("lw").value.trim(),k=$("lk").value;
  if(i.length<3||w.length<3){$("le").textContent="Enter the item and where it was lost or found, at least 3 characters each.";return}
  go($("ls"),async()=>{const r=await sb.from("lost_items").insert({kind:k,item:i,location:w,status:k==="Found"?"At Information Counter":"Searching"});if(r.error)return fail(r.error);await pull();lost()})};
 app.querySelectorAll("select[data-l]").forEach(s=>s.onchange=()=>{const x=db.lost.find(y=>y.id==s.dataset.l);if(m&&x){
  go(s,async()=>{const r=await sb.from("lost_items").update({status:s.value}).eq("id",x.id);if(r.error)return fail(r.error);await pull();lost()})}})}

/* Chat assistant (runs locally, no network) */
const STOP="where what the are can you find store shop located how which floor there near any get does have and for with this that".split(" ");
const KW=[[/coffee|cafe|caf\u00e9|kopi/,/coffee|cafe|caffe|java|liberica|luwak|koi/],[/ramen/,/ramen|men-oh|ebisoba/],[/cinema|movie|film|bioskop/,/cinema/],[/supermarket|grocer/,/aeon bsd city store/],[/toy|kids|mainan/,/toy|kids|snoopy|multi toys/],[/phone|electronic|gadget|laptop/,/erafone|samsung|best denki|gadget|iconnect|wellcomm|telesindo/],[/book/,/gramedia/],[/bank|atm/,/bni|cimb/],[/gym|fitness/,/celebrity/],[/pizza/,/piza|popolamama/]];
const has=(t,n)=>{n=n.toLowerCase();const i=t.indexOf(n);if(i<0)return false;const a=t[i-1],b=t[i+n.length];return !(a&&/[a-z0-9]/.test(a))&&!(b&&/[a-z0-9]/.test(b))};
const loc=s=>`${s.name}: ${flName(s.fl).toLowerCase()}, unit ${s.id}`;
function reply(q){const t=q.toLowerCase().trim(),W=t.split(/[^a-z0-9&']+/).filter(w=>w.length>3&&!STOP.includes(w));
 const exact=STORES.filter(s=>s.name.length>3&&has(t,s.name));
 if(exact.length)return exact.slice(0,5).map(loc).join("\n")+"\nUnit codes are placeholders, so use the Store finder tab for the full list.";
 if(/park|parkir|vehicle/.test(t)){if(!db||!db.park)return "Parking counts load after you continue as a visitor or sign in. Open the Parking tab once you are in.";return "Free parking spaces right now:\n"+ZONES.map(z=>`\u2022 ${z.n}: ${Math.max(0,z.cap-(db.park[z.k]||0))} of ${z.cap}`).join("\n")+"\nThe mall office updates these counts by hand."}
 if(/lost|found|missing|wallet|hilang|ditemukan|ketemu/.test(t)){const n=db&&db.lost?db.lost.filter(x=>x.status!=="Returned"):[],hit=n.filter(x=>W.some(w=>x.item.toLowerCase().includes(w)));
  return (hit.length?"Possible matches:\n"+hit.slice(0,4).map(x=>`\u2022 ${x.kind}: ${x.item} (${x.where}, ${x.status})`).join("\n")+"\n\n":"")+"To report something lost or found, open the Lost & found tab. Found items should be handed to the Information Counter."}
 if(/ticket|maintenance|repair|broken|leak|problem|issue|lapor|rusak/.test(t)){
  if(!me||me.role==="visitor"||!db)return "Maintenance tickets are for store staff. If you see a problem in the mall, please tell the Information Counter.";
  const o=db.tickets.filter(x=>(me.role==="manager"||x.uid===me.id)&&x.status!=="Resolved").length;
  return me.role==="manager"?`There are ${o} unresolved tickets. Open the Tickets tab to change a status or assign a crew.`:`To report a problem, open My tickets, then Report an issue. Your store has ${o} unresolved ticket(s).`}
 for(const [k,n] of KW)if(k.test(t)){const r=STORES.filter(s=>n.test(s.name.toLowerCase()));if(r.length)return r.slice(0,6).map(loc).join("\n")+(r.length>6?`\n\u2026and ${r.length-6} more in the Store finder.`:"")}
 if(/eat|food|restaurant|hungry|makan/.test(t))return "Food & beverage tenants by floor:\n"+FL.map(f=>`\u2022 ${f[1]}: ${STORES.filter(s=>s.fl===f[0]&&s.cat==="Food & beverage").length}`).join("\n")+"\nTell me a cuisine or a name, or use the Store finder.";
 if(/hour|open|close|buka|tutup/.test(t))return "I don't have opening hours. Please check AEON Mall's official website or ask at the Information Counter.";
 const f=W.length?STORES.filter(s=>W.some(w=>s.name.toLowerCase().includes(w))).slice(0,5):[];
 if(f.length)return "Closest matches:\n"+f.map(loc).join("\n");
 if(/^(hi|hello|hey|halo|hai)\b/.test(t))return "Hello! Ask me about a store, parking, lost items or reporting a problem.";
 if(/thank|terima/.test(t))return "You're welcome!";
 return "Sorry, I didn't catch that. I can help with finding a store, parking, lost & found, and maintenance tickets.";}
function mkBot(){const w=document.createElement("div");
 w.innerHTML=`<button id="botb" aria-label="Open chat assistant" aria-expanded="false" aria-controls="botp">\u{1F4AC}</button><section id="botp" aria-label="Chat assistant"><div id="botm" role="log" aria-live="polite"></div><div id="botc"></div><form id="botf"><input id="boti" placeholder="Ask about stores, parking\u2026" aria-label="Your message" maxlength="200" autocomplete="off"><button type="submit">Send</button></form></section>`;
 document.body.appendChild(w);const m=$("botm");
 const say=(t,c)=>{const d=document.createElement("div");d.className="bm "+c;d.textContent=t;m.appendChild(d);m.scrollTop=m.scrollHeight};
 const ask=q=>{say(q,"u");say(reply(q),"b")};
 const toggle=o=>{const open=$("botp").classList.toggle("open",o);$("botb").setAttribute("aria-expanded",open);if(open){if(!m.children.length)say("Hi! I'm the AEON FixIt assistant. I can help you find a store, check parking, handle lost items, or report a problem.","b");$("boti").focus()}else $("botb").focus()};
 $("botc").innerHTML=["Where is UNIQLO?","Is parking available?","I lost something","Where can I get coffee?"].map(c=>`<button type="button" class="ghost">${c}</button>`).join("");
 $("botc").onclick=e=>{if(e.target.tagName==="BUTTON")ask(e.target.textContent)};
 $("botf").onsubmit=e=>{e.preventDefault();const v=$("boti").value.trim();if(v){$("boti").value="";ask(v)}};
 $("botp").onkeydown=e=>{if(e.key==="Escape")toggle(false)};
 $("botb").onclick=()=>toggle()}
mkBot();

/* Tickets */
function vis(){const k=PRI.indexOf.bind(PRI);
 return db.tickets.filter(t=>me.role==="manager"||t.uid===me.id).filter(t=>filt.status==="All"||t.status===filt.status).filter(t=>filt.pri==="All"||t.pri===filt.pri).filter(t=>!filt.q||(t.title+t.unit+t.cat).toLowerCase().includes(filt.q.toLowerCase()))
  .sort((a,b)=>filt.sort==="pri"?(k(b.pri)-k(a.pri))||(b.id-a.id):b.id-a.id)}
function tix(){
 const all=db.tickets.filter(t=>me.role==="manager"||t.uid===me.id),cnt=s=>all.filter(t=>t.status===s).length;
 let h=`<div class="stats"><div class="stat"><b>${all.length}</b><small>Total tickets</small></div><div class="stat"><b>${cnt("Open")}</b><small>Open</small></div><div class="stat"><b>${cnt("In progress")}</b><small>In progress</small></div><div class="stat"><b>${cnt("Resolved")}</b><small>Resolved</small></div></div>
 <div class="tabs"><button class="${tab==="list"?"on":""}" data-t="list">${me.role==="manager"?"All tickets":"My tickets"}</button>${me.role==="tenant"?`<button class="${tab==="new"?"on":""}" data-t="new">Report an issue</button>`:`<button class="ghost" id="csv">Export CSV</button>`}</div>`;
 h+=tab==="new"&&me.role==="tenant"?form():list();
 app.innerHTML=h;
 app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
 if(tab==="new"&&me.role==="tenant")wireForm();else wireList();
 const c=$("csv");if(c)c.onclick=exportCsv}
function form(){return `<div class="card"><h2>Report an issue</h2><label for="ti">Short title</label><input id="ti" maxlength="80">
 <div class="row"><div><label for="ca">Category</label><select id="ca">${CATS.map(c=>`<option>${c}</option>`).join("")}</select></div><div><label for="pr">Priority</label><select id="pr">${PRI.map(c=>`<option ${c==="Normal"?"selected":""}>${c}</option>`).join("")}</select></div></div>
 <label for="de">What is happening?</label><textarea id="de" rows="4" maxlength="500"></textarea><p class="err" id="fe" role="alert"></p><button id="sub">Submit ticket</button></div>`}
function wireForm(){$("sub").onclick=()=>{const t=$("ti").value.trim(),d=$("de").value.trim();
 if(t.length<5||d.length<10){$("fe").textContent="Enter a title of at least 5 characters and a description of at least 10 characters.";return}
 go($("sub"),async()=>{const r=await sb.from("tickets").insert({store_id:me.unit,category:$("ca").value,priority:$("pr").value,title:t,description:d});if(r.error)return fail(r.error);await pull();tab="list";render()})}}
function list(){const ts=vis(),opt=(a,v)=>a.map(s=>`<option ${s===v?"selected":""}>${s}</option>`).join("");
 let h=`<div class="card"><div class="row"><div><label for="fs">Status</label><select id="fs">${opt(["All",...STAT],filt.status)}</select></div><div><label for="fp">Priority</label><select id="fp">${opt(["All",...PRI],filt.pri)}</select></div><div><label for="fo">Sort by</label><select id="fo"><option value="new" ${filt.sort==="new"?"selected":""}>Newest first</option><option value="pri" ${filt.sort==="pri"?"selected":""}>Highest priority first</option></select></div><div><label for="fq">Search</label><input id="fq" type="search" value="${esc(filt.q)}" placeholder="Title, unit or category"></div></div></div><div class="card tkgrid">`;
 if(!ts.length)h+=`<p class="empty">No tickets match. ${me.role==="tenant"?"Use “Report an issue” to create one.":"Adjust the filter."}</p>`;
 h+=ts.map(t=>`<div class="tk"><h3>#${t.id} ${esc(t.title)}</h3><div class="meta">${esc(t.unit)} · ${esc(t.cat)}</div>
 <div style="margin:6px 0"><span class="pill ${cls(t.status)}">${esc(t.status)}</span><span class="pill ${cls(t.pri)}">${esc(t.pri)}</span><span class="meta">${esc(t.team)}</span></div>
 <div>${esc(t.desc)}</div>
 ${me.role==="manager"?`<div class="row" style="margin-top:8px"><div><label for="s${t.id}">Status</label><select id="s${t.id}" data-id="${t.id}" data-f="status">${opt(STAT,t.status)}</select></div><div><label for="a${t.id}">Assign to</label><select id="a${t.id}" data-id="${t.id}" data-f="team">${opt(TEAMS,t.team)}</select></div><div style="align-self:end;flex:0 0 auto"><button class="ghost" data-del="${t.id}">Delete</button></div></div>`:""}
 <ul class="log">${t.log.map(l=>`<li>${esc(l)}</li>`).join("")}</ul></div>`).join("");
 return h+"</div>"}
function wireList(){
 const set=(id,k)=>{$(id).onchange=e=>{filt[k]=e.target.value;render()}};set("fs","status");set("fp","pri");set("fo","sort");
 $("fq").oninput=e=>{filt.q=e.target.value;keepFocus("fq",render)};
 app.querySelectorAll("select[data-id]").forEach(s=>s.onchange=()=>{const t=db.tickets.find(x=>x.id==s.dataset.id);if(me.role!=="manager"||!t)return;
  go(s,async()=>{const r=await sb.from("tickets").update(s.dataset.f==="status"?{status:s.value}:{assigned_team:s.value}).eq("id",t.id);if(r.error)return fail(r.error);await pull();render()})});
 app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(me.role==="manager"&&confirm("Delete ticket #"+b.dataset.del+"? This cannot be undone.")){
  go(b,async()=>{const r=await sb.from("tickets").delete().eq("id",b.dataset.del);if(r.error)return fail(r.error);await pull();render()})}})}
/* CSV: quotes every cell, and prefixes a ' to cells that start with = + - @ so spreadsheets do not run them as formulas. Exports the filtered view. */
function exportCsv(){const q=v=>{v=String(v==null?"":v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
 const rows=[["ID","Unit","Category","Priority","Status","Team","Title","Description"],...vis().map(t=>[t.id,t.unit,t.cat,t.pri,t.status,t.team,t.title,t.desc])];
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"}));a.download="aeon-fixit-tickets.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
init();
</script>
