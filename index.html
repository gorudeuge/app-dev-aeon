 const ask=q=>{say(q,"u");say(reply(q),"b")};
 $("botc").innerHTML=["Where is UNIQLO?","Is parking available?","I lost something","Where can I get coffee?"].map(c=>`<button type="button" class="ghost">${c}</button>`).join("");
 $("botc").onclick=e=>{if(e.target.tagName==="BUTTON")ask(e.target.textContent)};
 $("botf").onsubmit=e=>{e.preventDefault();const v=$("boti").value.trim();if(v){$("boti").value="";ask(v)}};
 $("botb").onclick=()=>{const o=$("botp").classList.toggle("open");$("botb").setAttribute("aria-expanded",o);if(o){if(!m.children.length)say("Hi! I'm the AEON FixIt assistant. I can help you find a store, check parking, handle lost items, or report a problem.","b");$("boti").focus()}}}
mkBot();
const CATS=["Electrical","Plumbing","Air conditioning","Cleaning","Signage","Security","Other"];
const PRI=["Low","Normal","High","Urgent"],STAT=["Open","In progress","Resolved"],TEAMS=["Unassigned","Electrical crew","Plumbing crew","HVAC crew","Housekeeping","Security"];
const now=()=>new Date().toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let db,me=null,tab="list",filt={status:"All",q:""};
function load(){try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){db=null}
 if(!db||!Array.isArray(db.tickets)){db={n:3,park:{A:820,B:210,D:6,W:22},lost:[{id:1,kind:"Found",item:"Black wallet",where:"Food Carnival, 3rd floor",date:now(),status:"At Information Counter"},{id:2,kind:"Lost",item:"Blue child’s water bottle",where:"Miniapolis, 2nd floor",date:now(),status:"Searching"}],tickets:[
  {id:1,uid:sid("Starbucks Coffee").id,unit:sid("Starbucks Coffee").id,cat:"Air conditioning",pri:"High",title:"AC not cooling in seating area",desc:"Temperature stays above 30°C since morning.",status:"In progress",team:"HVAC crew",log:["Created "+now(),"Assigned to HVAC crew"]},
  {id:2,uid:sid("UNIQLO").id,unit:sid("UNIQLO").id,cat:"Electrical",pri:"Urgent",title:"Flickering lights in fitting room",desc:"Two panels flicker and buzz.",status:"Open",team:"Unassigned",log:["Created "+now()]},
  {id:3,uid:sid("Gramedia").id,unit:sid("Gramedia").id,cat:"Cleaning",pri:"Low",title:"Water stain on ceiling tile",desc:"Small stain, no dripping.",status:"Resolved",team:"Housekeeping",log:["Created "+now(),"Resolved "+now()]}]};save()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const fail=e=>alert("Something went wrong: "+((e&&e.message)||e));
const fmt=d=>new Date(d).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"});
const bye=async()=>{await sb.auth.signOut();me=null;sec="";login()};
async function pull(){
 const [t,ev,z,l]=await Promise.all([sb.from("tickets").select("*").order("id",{ascending:false}),sb.from("ticket_events").select("*").order("created_at"),sb.from("parking_zones").select("*"),sb.from("lost_items").select("*").order("created_at")]);
 for(const r of [t,ev,z,l])if(r.error)throw r.error;
 db={tickets:t.data.map(r=>({id:r.id,uid:r.store_id,unit:r.store_id,cat:r.category,pri:r.priority,title:r.title,desc:r.description,status:r.status,team:r.assigned_team,log:ev.data.filter(e=>e.ticket_id===r.id).map(e=>e.note+" · "+fmt(e.created_at))})),
  park:Object.fromEntries(z.data.map(r=>[r.key,r.occupied])),lost:l.data.map(r=>({id:r.id,kind:r.kind,item:r.item,where:r.location,date:fmt(r.created_at),status:r.status}))}}
async function enter(u){me=u;try{await pull();render()}catch(e){fail(e)}}
async function fromSession(){const {data:{session}}=await sb.auth.getSession();if(!session)return false;
 const {data:p,error}=await sb.from("profiles").select("*").eq("id",session.user.id).single();if(error||!p)return false;
 const s=STORES.find(x=>x.id===p.store_id),m=p.role==="manager";
 await enter({id:m?session.user.id:p.store_id,name:m?"Facilities Manager":(s?s.name+" ("+s.id+")":"Store staff"),role:p.role,unit:p.store_id||"Mall Office"});return true}
async function init(){try{if(!(await fromSession()))login()}catch(e){login()}}
function login(){nav.innerHTML="";$("who").textContent="";$("out").hidden=true;
 app.innerHTML=`<div class="card" style="max-width:420px;margin:30px auto"><h2>Welcome to AEON Mall BSD City</h2>
 <p class="meta">Store staff and the facilities manager sign in with email and password. Visitors need no account.</p>
 <label for="em">Email</label><input id="em" type="email" autocomplete="username"><label for="pw">Password (6+ characters)</label><input id="pw" type="password" autocomplete="current-password">
 <p class="err" id="e" role="alert"></p><button id="go">Sign in</button> <button id="gu" class="ghost">Continue as visitor</button>
 <h2 style="margin-top:22px">New store account</h2><p class="meta">Uses the email and password above.</p>
 <label for="st">Your store</label><select id="st">${FL.map(f=>`<optgroup label="${f[1]}">${STORES.filter(s=>s.fl===f[0]).map(s=>`<option value="${s.id}">${esc(s.name)} (${s.id})</option>`).join("")}</optgroup>`).join("")}</select>
 <p><button id="su" class="ghost">Create store account</button></p></div>`;
 const msg=t=>{$("e").textContent=t},cred=()=>({email:$("em").value.trim(),password:$("pw").value});
 $("go").onclick=async()=>{const {error}=await sb.auth.signInWithPassword(cred());if(error)return msg("Sign-in failed: "+error.message);if(!(await fromSession()))msg("This account has no profile yet. Ask the facilities manager.")};
 $("su").onclick=async()=>{const {data,error}=await sb.auth.signUp({...cred(),options:{data:{store_id:$("st").value}}});if(error)return msg("Could not create the account: "+error.message);if(!data.session)return msg("Account created. Confirm it from the email we sent, then sign in.");await fromSession()};
 $("gu").onclick=async()=>{await sb.auth.signOut();enter({id:"v",name:"Visitor",role:"visitor",unit:"-"})}}
function vis(){return db.tickets.filter(t=>me.role==="manager"||t.uid===me.id).filter(t=>filt.status==="All"||t.status===filt.status).filter(t=>!filt.q||(t.title+t.unit+t.cat).toLowerCase().includes(filt.q.toLowerCase())).sort((a,b)=>b.id-a.id)}
function tix(){
 document.getElementById("who").textContent=me.name;const o=document.getElementById("out");o.hidden=false;o.onclick=bye;
 const all=db.tickets.filter(t=>me.role==="manager"||t.uid===me.id);
 const cnt=s=>all.filter(t=>t.status===s).length;
 let h=`<div class="stats"><div class="stat"><b>${all.length}</b><small>Total tickets</small></div><div class="stat"><b>${cnt("Open")}</b><small>Open</small></div><div class="stat"><b>${cnt("In progress")}</b><small>In progress</small></div><div class="stat"><b>${cnt("Resolved")}</b><small>Resolved</small></div></div>
 <div class="tabs"><button class="${tab==="list"?"on":""}" data-t="list">${me.role==="manager"?"All tickets":"My tickets"}</button>${me.role==="tenant"?`<button class="${tab==="new"?"on":""}" data-t="new">Report an issue</button>`:`<button class="ghost" id="csv">Export CSV</button>`}</div>`;
 if(tab==="new")h+=form();else h+=list();
 app.innerHTML=h;
 app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
 if(tab==="new")wireForm();else wireList();
 const c=document.getElementById("csv");if(c)c.onclick=exportCsv}
function form(){return `<div class="card"><h2>Report an issue</h2><label for="ti">Short title</label><input id="ti" maxlength="80">
 <div class="row"><div><label for="ca">Category</label><select id="ca">${CATS.map(c=>`<option>${c}</option>`).join("")}</select></div><div><label for="pr">Priority</label><select id="pr">${PRI.map(c=>`<option ${c==="Normal"?"selected":""}>${c}</option>`).join("")}</select></div></div>
 <label for="de">What is happening?</label><textarea id="de" rows="4" maxlength="500"></textarea><p class="err" id="fe" role="alert"></p><button id="sub">Submit ticket</button></div>`}
function wireForm(){document.getElementById("sub").onclick=()=>{const t=ti.value.trim(),d=de.value.trim();
 if(t.length<5||d.length<10){fe.textContent="Enter a title of at least 5 characters and a description of at least 10 characters.";return}
 sb.from("tickets").insert({store_id:me.unit,category:ca.value,priority:pr.value,title:t,description:d}).then(async r=>{if(r.error)return fail(r.error);await pull();tab="list";render()})}}
function list(){const ts=vis();
 let h=`<div class="card"><div class="row"><div><label for="fs">Status</label><select id="fs">${["All",...STAT].map(s=>`<option ${s===filt.status?"selected":""}>${s}</option>`).join("")}</select></div><div><label for="fq">Search</label><input id="fq" value="${esc(filt.q)}" placeholder="Title, unit or category"></div></div></div><div class="card tkgrid">`;
 if(!ts.length)h+=`<p class="empty">No tickets match. ${me.role==="tenant"?"Use “Report an issue” to create one.":"Adjust the filter."}</p>`;
 h+=ts.map(t=>`<div class="tk"><h3>#${t.id} ${esc(t.title)}</h3><div class="meta">${esc(t.unit)} · ${esc(t.cat)}</div>
 <div style="margin:6px 0"><span class="pill ${t.status.replace(" ","-")}">${t.status}</span><span class="pill ${t.pri}">${t.pri}</span><span class="meta">${esc(t.team)}</span></div>
 <div>${esc(t.desc)}</div>
 ${me.role==="manager"?`<div class="row" style="margin-top:8px"><div><label>Status</label><select data-id="${t.id}" data-f="status">${STAT.map(s=>`<option ${s===t.status?"selected":""}>${s}</option>`).join("")}</select></div><div><label>Assign to</label><select data-id="${t.id}" data-f="team">${TEAMS.map(s=>`<option ${s===t.team?"selected":""}>${s}</option>`).join("")}</select></div><div style="align-self:end;flex:0 0 auto"><button class="ghost" data-del="${t.id}">Delete</button></div></div>`:""}
 <ul class="log">${t.log.map(l=>`<li>${esc(l)}</li>`).join("")}</ul></div>`).join("");
 return h+"</div>"}
function wireList(){const fs=document.getElementById("fs"),fq=document.getElementById("fq");
 fs.onchange=()=>{filt.status=fs.value;render()};
 fq.oninput=()=>{filt.q=fq.value;const p=fq.selectionStart;render();const n=document.getElementById("fq");n.focus();n.setSelectionRange(p,p)};
 app.querySelectorAll("select[data-id]").forEach(s=>s.onchange=()=>{const t=db.tickets.find(x=>x.id==s.dataset.id);if(me.role!=="manager"||!t)return;
  sb.from("tickets").update(s.dataset.f==="status"?{status:s.value}:{assigned_team:s.value}).eq("id",t.id).then(async r=>{if(r.error)return fail(r.error);await pull();render()})});
 app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(me.role==="manager"&&confirm("Delete ticket #"+b.dataset.del+"? This cannot be undone.")){sb.from("tickets").delete().eq("id",b.dataset.del).then(async r=>{if(r.error)return fail(r.error);await pull();render()})}})}
function exportCsv(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const rows=[["ID","Unit","Category","Priority","Status","Team","Title","Description"],...db.tickets.map(t=>[t.id,t.unit,t.cat,t.pri,t.status,t.team,t.title,t.desc])];
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"}));a.download="aeon-fixit-tickets.csv";a.click()}
const app=document.getElementById("app");init();
</script>
</body>
</html>
