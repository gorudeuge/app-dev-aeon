*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{background:var(--ac);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

label{display:block;font-size:.85rem;color:var(--mu);margin:10px 0 4px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--ln);border-radius:6px;background:var(--bg)}

button{cursor:pointer;border:1px solid var(--ac);background:var(--ac);color:#fff;padding:8px 14px;border-radius:6px;font-weight:600}
button.ghost{background:transparent;color:var(--ac)}
header button{background:#fff;color:var(--ac);border-color:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 180px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--sf);border:1px solid var(--ln);border-left:5px solid var(--ac);border-radius:8px;padding:10px 14px}

.tk{border-top:1px solid var(--ln);padding:12px 0}.tk:first-child{border-top:0}

.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tabs button.on{background:var(--ac);color:#fff}.tabs button:not(.on){background:transparent;color:var(--ac)}

button,input,select{min-height:44px}
nav{display:flex;gap:8px;padding:10px 20px;background:var(--sf);border-bottom:1px solid var(--ln);overflow-x:auto}nav:empty{display:none}nav button{background:transparent;color:var(--ac);white-space:nowrap}nav button.on{background:var(--ac);color:#fff}
header{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
main{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

</style>

 let h=`<div class="card"><div class="row"><div><label for="fs">Status</label><select id="fs">${["All",...STAT].map(s=>`<option ${s===filt.status?"selected":""}>${s}</option>`).join("")}</select></div><div><label for="fq">Search</label><input id="fq" value="${esc(filt.q)}" placeholder="Title, unit or category"></div></div></div><div class="card tkgrid">`;
 if(!ts.length)h+=`<p class="empty">No tickets match. ${me.role==="tenant"?"Use “Report an issue” to create one.":"Adjust the filter."}</p>`;
 h+=ts.map(t=>`<div class="tk"><h3>#${t.id} ${esc(t.title)}</h3><div class="meta">${esc(t.unit)} · ${esc(t.cat)}</div>
 <div style="margin:6px 0"><span class="pill ${t.status.replace(" ","-")}">${t.status}</span><span class="pill ${t.pri}">${t.pri}</span><span class="meta">${esc(t.team)}</span></div>
 <div>${esc(t.desc)}</div>
 ${me.role==="manager"?`<div class="row" style="margin-top:8px"><div><label>Status</label><select data-id="${t.id}" data-f="status">${STAT.map(s=>`<option ${s===t.status?"selected":""}>${s}</option>`).join("")}</select></div><div><label>Assign to</label><select data-id="${t.id}" data-f="team">${TEAMS.map(s=>`<option ${s===t.team?"selected":""}>${s}</option>`).join("")}</select></div><div style="align-self:end;flex:0 0 auto"><button class="ghost" data-del="${t.id}">Delete</button></div></div>`:""}
 <ul class="log">${t.log.map(l=>`<li>${esc(l)}</li>`).join("")}</ul></div>`).join("");
 return h+"</div>"}
function wireList(){const fs=document.getElementById("fs"),fq=document.getElementById("fq");
 fs.onchange=()=>{filt.status=fs.value;render()};
 fq.oninput=()=>{filt.q=fq.value;const p=fq.selectionStart;render();const n=document.getElementById("fq");n.focus();n.setSelectionRange(p,p)};
 app.querySelectorAll("select[data-id]").forEach(s=>s.onchange=()=>{const t=db.tickets.find(x=>x.id==s.dataset.id);if(me.role!=="manager"||!t)return;
  sb.from("tickets").update(s.dataset.f==="status"?{status:s.value}:{assigned_team:s.value}).eq("id",t.id).then(async r=>{if(r.error)return fail(r.error);await pull();render()})});
 app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(me.role==="manager"&&confirm("Delete ticket #"+b.dataset.del+"? This cannot be undone.")){sb.from("tickets").delete().eq("id",b.dataset.del).then(async r=>{if(r.error)return fail(r.error);await pull();render()})}})}
function exportCsv(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const rows=[["ID","Unit","Category","Priority","Status","Team","Title","Description"],...db.tickets.map(t=>[t.id,t.unit,t.cat,t.pri,t.status,t.team,t.title,t.desc])];
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"}));a.download="aeon-fixit-tickets.csv";a.click()}
const app=document.getElementById("app");init();
</script>
